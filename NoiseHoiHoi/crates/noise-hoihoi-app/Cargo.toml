[package]
name = "noise-hoihoi-app"
description = "NoiseHoiHoi desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[build-dependencies]
winresource = "0.1.31"

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
eframe.workspace = true
noise-hoihoi-engine = { path = "../noise-hoihoi-engine" }
serde.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Enable the Glow window backends directly; eframe 0.36.1's forwarding
# features also resolve its unused optional egui-wgpu dependency.
egui-winit = { version = "0.36.1", default-features = false, features = ["wayland", "x11"] }
egui_glow = { version = "0.36.1", default-features = false, features = ["wayland", "x11"] }
glutin = { version = "0.32.3", default-features = false, features = ["wayland", "x11", "glx"] }
glutin-winit = { version = "0.5.0", default-features = false, features = ["wayland", "x11", "glx"] }
