[test-groups]
noisenet-cpu = { max-threads = 1 }
noisenet-wgpu = { max-threads = 1 }

[profile.default]
retries = 0
flaky-result = "fail"
default-filter = "not binary(stress_cpu)"

[[profile.default.overrides]]
filter = "package(noise-net) and binary(/_cpu$/)"
test-group = "noisenet-cpu"
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
filter = "package(noise-net) and binary(/_wgpu$/)"
test-group = "noisenet-wgpu"
slow-timeout = { period = "2m", terminate-after = 3 }

[profile.noisenet-full]
inherits = "default"
default-filter = "all()"

[[profile.noisenet-full.overrides]]
filter = "package(noise-net) and binary(stress_cpu)"
test-group = "noisenet-cpu"
slow-timeout = { period = "5m", terminate-after = 3 }
