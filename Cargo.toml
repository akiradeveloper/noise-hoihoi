[workspace]
members = [
    "NoiseNet/crates/noise-net-iree",
    "NoiseHoiHoi/crates/noise-hoihoi-app",
    "NoiseHoiHoi/crates/noise-hoihoi-engine",
    "NoiseHoiHoi/crates/noise-hoihoi-platform",
    "NoiseHoiHoi/crates/noise-hoihoi-session",
    "tools/audio-smoke",
]
exclude = ["vendor/gpui-pre-windows"]
resolver = "3"

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.95"
authors = ["Akira Hayakawa"]
license = "MIT"
repository = "https://github.com/akiradeveloper/noise-hoihoi"

[workspace.dependencies]
anyhow = "1.0.99"
clap = { version = "4.5.47", features = ["derive"] }
cpal = "0.18.2"
gpui-kit = "=0.6.1"
rtrb = "0.4.0"
rubato = { version = "5.0.0", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
thiserror = "2.0.16"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

# GPUI Windows shader compilation on a Linux host; see vendor README.
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
