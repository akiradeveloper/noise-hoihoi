[workspace]
members = [
    "NoiseHoiHoi/crates/noise-hoihoi-app",
    "NoiseHoiHoi/crates/noise-hoihoi-engine",
    "tools/audio-smoke",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
authors = ["Akira Hayakawa"]
license = "MIT"
repository = "https://github.com/akiradeveloper/noise-hoihoi"

[workspace.dependencies]
anyhow = "1.0.99"
clap = { version = "4.5.47", features = ["derive"] }
cpal = "0.18.2"
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "persistence"] }
rtrb = "0.4.0"
rubato = { version = "5.0.0", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.16"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
